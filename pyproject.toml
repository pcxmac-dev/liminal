[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liminal"
version = "0.1.0"
description = "Download, collate, analyse and chart stock market data from the Massive API (free and paid plans)."
readme = "README.md"
requires-python = ">=3.10"
# the library (the stores, the plugin contract, the collector, the scheme: liminal-lib) brings the
# data dependencies (pandas below 3.1, numpy, requests, exchange_calendars, duckdb, pymongo, plotly)
dependencies = [
    "liminal-lib @ git+https://github.com/pcxmac-dev/liminal-lib@v1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# the fetcher, released on its own (the app's pages get their data through it)
integrator = ["liminal-integrator @ git+https://github.com/pcxmac-dev/liminal-integrator@v1.0.1"]
# the plugins released on their own, from their tags (docs/ARCHITECTURE.md: Providers are plugins)
plugins = [
    "liminal-plugin-cboe @ git+https://github.com/pcxmac-dev/liminal-plugin-cboe@v1.2.0",
    "liminal-plugin-bitstamp @ git+https://github.com/pcxmac-dev/liminal-plugin-bitstamp@v1.3.0",
    "liminal-plugin-coinbase @ git+https://github.com/pcxmac-dev/liminal-plugin-coinbase@v1.3.0",
    "liminal-plugin-bitfinex @ git+https://github.com/pcxmac-dev/liminal-plugin-bitfinex@v1.2.0",
    "liminal-plugin-tiingo @ git+https://github.com/pcxmac-dev/liminal-plugin-tiingo@v1.4.0",
    "liminal-plugin-french @ git+https://github.com/pcxmac-dev/liminal-plugin-french@v1.1.0",
    "liminal-plugin-datahub @ git+https://github.com/pcxmac-dev/liminal-plugin-datahub@v1.1.0",
    "liminal-plugin-federal @ git+https://github.com/pcxmac-dev/liminal-plugin-federal@v1.4.0",
    "liminal-plugin-alpaca @ git+https://github.com/pcxmac-dev/liminal-plugin-alpaca@v1.4.0",
    "liminal-plugin-massive @ git+https://github.com/pcxmac-dev/liminal-plugin-massive@v1.4.0",
]

[project.scripts]
liminal = "liminal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liminal = ["gui/static/*", "gui/static/vendor/klinecharts/*", "gui/static/vendor/world/*", "gui/static/vendor/sky/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
