[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liminal"
version = "0.1.0"
description = "Download, collate, analyse and chart stock market data from the Massive API (free and paid plans)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    # pandas 3.1 refuses exchange_calendars' OrthodoxEaster offset ("does not have a vectorized
    # implementation"), and Belgrade, Bucharest, Athens and Cyprus lose their calendars (Markets view,
    # tests/test_markets.py): held below 3.1 until exchange_calendars (4.13.2) supports it.
    "pandas>=2.1,<3.1",
    "numpy>=1.26",
    "plotly>=5.18",
    "tzdata>=2023.3",
    "exchange_calendars>=4.5",  # world exchange sessions, lunch breaks and holidays (Markets view)
    "duckdb>=1.1",  # closed months of bars by column (storage/history.py)
    "pymongo>=4.9",  # documents on the MongoDB server here (mongo.py, storage/documents.py)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# the plugins released on their own, from their tags (docs/ARCHITECTURE.md: Providers are plugins)
plugins = ["liminal-plugin-cboe @ git+https://github.com/pcxmac-dev/liminal-plugin-cboe@v1.2.0"]

[project.scripts]
liminal = "liminal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liminal = ["gui/static/*", "gui/static/vendor/klinecharts/*", "gui/static/vendor/world/*", "gui/static/vendor/sky/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
