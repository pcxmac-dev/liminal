[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liminal-app"
version = "0.2.0"
description = "The Liminal chart app: the chart page and its data views, served by a front that funnels every request to the fetcher (liminal-integrator), on liminal-lib."
readme = "README.md"
requires-python = ">=3.10"
# the library (the stores, the plugin contract, the collector, the scheme: liminal-lib) brings the
# data dependencies (pandas below 3.1, numpy, requests, exchange_calendars, duckdb, pymongo, plotly)
dependencies = [
    "liminal-lib @ git+https://github.com/pcxmac-dev/liminal-lib@v1.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# the fetcher, released on its own (the app's pages get their data through it)
integrator = ["liminal-integrator @ git+https://github.com/pcxmac-dev/liminal-integrator@v1.2.0"]
# the plugins released on their own, from their tags (docs/ARCHITECTURE.md: Providers are plugins)
plugins = [
    "liminal-plugin-cboe @ git+https://github.com/pcxmac-dev/liminal-plugin-cboe@v1.2.1",
    "liminal-plugin-bitstamp @ git+https://github.com/pcxmac-dev/liminal-plugin-bitstamp@v1.3.1",
    "liminal-plugin-coinbase @ git+https://github.com/pcxmac-dev/liminal-plugin-coinbase@v1.3.1",
    "liminal-plugin-bitfinex @ git+https://github.com/pcxmac-dev/liminal-plugin-bitfinex@v1.2.1",
    "liminal-plugin-tiingo @ git+https://github.com/pcxmac-dev/liminal-plugin-tiingo@v1.4.1",
    "liminal-plugin-french @ git+https://github.com/pcxmac-dev/liminal-plugin-french@v1.1.1",
    "liminal-plugin-datahub @ git+https://github.com/pcxmac-dev/liminal-plugin-datahub@v1.1.1",
    "liminal-plugin-federal @ git+https://github.com/pcxmac-dev/liminal-plugin-federal@v1.4.1",
    "liminal-plugin-alpaca @ git+https://github.com/pcxmac-dev/liminal-plugin-alpaca@v1.4.1",
    "liminal-plugin-massive @ git+https://github.com/pcxmac-dev/liminal-plugin-massive@v1.4.1",
]

[project.scripts]
liminal = "liminal_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liminal_app = ["gui/static/*", "gui/static/vendor/klinecharts/*", "gui/static/vendor/world/*", "gui/static/vendor/sky/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
